syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.storage.kvstore";
option java_outer_classname = "StoreageProto";
option objc_class_prefix = "KVSTORE";

package kvstore;

// The greeting service definition.
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings
message HelloReply {
  string message = 1;
}

service PageLoader {
  // Sends a greeting
  rpc GetPage (GetPageRequest) returns (GetPageReply) {}
  rpc ShutdownServer (ShutdownRequest) returns (ShutdownReply) {}
  rpc LogReplay (LogReplayRequest) returns (LogReplayReply) {}
}

message Item {
  bytes key = 1;
  bytes value = 2;
}

message GetPageRequest {
  string page_id = 1;
}

message GetPageReply {
  repeated Item dataitem = 1;
}

message ShutdownRequest {
  string signal = 1;
}

message ShutdownReply {
  string signalret = 1;
}

message LogEntry {
  bytes data = 1;
  int32 size = 2;
}

message LogReplayRequest {
  repeated LogEntry entry = 1;
}

message LogReplayReply {
  int32 numreplay = 1;
}